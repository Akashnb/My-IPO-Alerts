name: Daily IPO GMP Alert

on:
  schedule:
    # 2:37 UTC = ~8:07 AM IST, Monday-Friday only (markets closed Sat/Sun).
    # Deliberately an odd minute (37, not 30/00) -- GitHub's own docs note that
    # popular times like exact half-hours get more queued/delayed/dropped due
    # to congestion across all of GitHub's scheduled workflows landing at once.
    - cron: "37 2 * * 1-5"
  workflow_dispatch:
    inputs:
      force_resend:
        description: "Force resend today's alerts even if already sent (for testing)"
        type: boolean
        default: false
  # Backup trigger, independent of GitHub's own scheduler. An external free
  # cron service (cron-job.org) pings this via the GitHub API every weekday
  # morning. If the schedule above ever misfires, this still fires the run --
  # and if BOTH fire the same day, the concurrency lock queues the second one
  # and same-day dedup in the script prevents a duplicate alert either way.
  repository_dispatch:
    types: [ipo-alert-trigger]

permissions:
  contents: write   # needed so the workflow can commit state.json back to the repo

concurrency:
  group: ipo-gmp-alert
  cancel-in-progress: false

jobs:
  check-ipo-gmp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run IPO GMP alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMP_THRESHOLD: "10"
          FORCE_RESEND: ${{ github.event.inputs.force_resend }}
        run: python ipo_gmp_alert.py

      - name: Save state.json back to the repo
        run: |
          git config user.name "ipo-gmp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "No state changes to commit." && exit 0
          git commit -m "Update IPO alert state [skip ci]"
          git push