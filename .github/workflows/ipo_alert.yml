name: Daily IPO GMP Alert

on:
  schedule:
    # 2:30 UTC = 8:00 AM IST, Monday-Friday only (markets closed Sat/Sun).
    # workflow_dispatch below is a separate trigger, so manual runs still work any day.
    - cron: "30 2 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub any day, incl. weekends

jobs:
  check-ipo-gmp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run IPO GMP alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMP_THRESHOLD: "10"
        run: python ipo_gmp_alert.py
